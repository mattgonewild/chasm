syntax = "proto3";

package proto;

option go_package = "github.com/ringboundio/chasm/daemon/proto;proto";

message ShepherdConfig {
    // Ignore is a set of Keys to ignore.
    // Must not be nil.
    map<fixed64, bool> ignore   = 1;
    
    // Controls what candle producers get spawned. Duplicates are not checked.
    // Must be within [0, 2047] and ascending.
    repeated sfixed32  interval = 2;
}
